services:
  postgres:
    image: postgres:17-alpine
    container_name: personal-shopper-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopper
      POSTGRES_PASSWORD: shopper
      POSTGRES_DB: personal_shopper
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shopper -d personal_shopper']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
